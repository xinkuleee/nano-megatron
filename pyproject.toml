[project]
name = "nano-megatron"
version = "1.0.0"
description = "A compact, readable implementation of Megatron's TP, SP, PP, and DP training core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano_megatron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "check_*.py"]
markers = ["distributed: launches local Gloo or torchrun processes"]
