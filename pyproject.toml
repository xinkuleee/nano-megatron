[project]
name = "nano-megatron"
version = "0.1.0"
description = "A minimal, readable implementation of Megatron-LM's tensor and pipeline parallelism."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano_megatron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
